name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for f in index.js lang.js badwords.js; do
            node --check "$f"
          done

      - name: Badwords smoke test
        run: |
          node -e "const {checkText}=require('./badwords');const assert=require('assert');assert(checkText('hello').found===false);assert(checkText('fuck').found===true);assert(checkText('cabrón').found===true);assert(checkText('cabron').found===true);console.log('smoke test passed');"
